<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ShotRelay MVP</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <h1>Shot<span>Relay</span></h1><small>撮る → 選ぶ → 相手を知る → もう一枚</small>
    </header>
    <main>
        <div id="notice" role="status"></div>
        <div id="identity"></div>
        <section id="setup"></section>
        <section id="shoot" hidden>
            <h2>相手の写真を撮る</h2>
            <p>構図を変えて3枚撮ると、好みの予想ができます。1枚でも送れます。</p><label class="file">カメラで撮る／写真を選ぶ<input id="photos" type="file"
                    accept="image/*" capture="environment" multiple></label>
            <div id="drafts" class="grid"></div>
            <p id="draft-count"></p><button id="send" disabled>写真を相手に送る</button>
            <p class="hint">一度に9枚まで。「送る」で撮影セットを区切ります。</p>
        </section>
        <section id="history"></section>
    </main>
    <script type="module" src="/app.js"></script>
</body>

</html>
